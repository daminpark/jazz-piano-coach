# /etc/nginx/sites-available/jazz  (app container)
# Only listens on localhost; the Cloudflare Tunnel is the sole way in.

# feedback posts: per visitor (Cloudflare passes the real client IP), a few per minute
limit_req_zone $http_cf_connecting_ip zone=jazz_feedback:1m rate=10r/m;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /opt/jazz-piano;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # versioned assets: install.sh points index.html at /v/<commit>/..., so every deploy gets new URLs
    # (Cloudflare gives static files a 4-hour browser cache, which would otherwise serve stale code)
    location ~ "^/v/[0-9a-f]{7,40}/(.+)$" {
        try_files /$1 =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "midi=(self), camera=(), microphone=(), geolocation=()" always;
    }

    # feedback API (server/feedback_api.py, jazz-feedback.service)
    location /api/ {
        limit_req zone=jazz_feedback burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
