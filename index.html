<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jazz Piano Coach</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1916'/%3E%3Cpath d='M12 23V8l11-3v15' stroke='%23e0a84a' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='9.5' cy='23' r='3.5' fill='%23e0a84a'/%3E%3Ccircle cx='20.5' cy='20' r='3.5' fill='%23e0a84a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today"><span class="logo">♪</span> Jazz Piano <small>daily coach</small></a>
    <nav>
      <a href="#today" data-view="today">Today</a>
      <a href="#path" data-view="path">Path</a>
      <a href="#practice" data-view="practice">Practice</a>
      <a href="#progress" data-view="progress">Progress</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <a class="midi-pill" href="#settings" title="MIDI status"><span class="dot" id="midiDot"></span><span id="midiLabel">MIDI…</span></a>
  </header>
  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-path"></section>
    <section class="view" id="view-practice">
      <div id="pHead" class="p-head"></div>
      <div id="drill"></div>
      <div class="kb-wrap" id="kbWrap"></div>
    </section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
